# 로컬 개발용. 실제 배포는 kodeploy로 한다(docs/DEPLOY.md).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myhome
      POSTGRES_PASSWORD: myhome
      POSTGRES_DB: myhome
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP로 확인한다. 초기화 중 임시 서버는 유닉스 소켓만 열어서, 소켓으로 보면 재시작 전에 healthy가 된다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U myhome -d myhome"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ./server
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://myhome:myhome@postgres:5432/myhome?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
