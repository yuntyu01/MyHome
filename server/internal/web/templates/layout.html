{{define "layout"}}<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
<title>{{.Title}} · MyHome 가계부</title>
<link rel="stylesheet" href="/static/app.css?v={{.AssetVer}}">
<script src="/static/theme.js?v={{.AssetVer}}"></script>
<script src="/static/vendor/htmx-2.0.11.min.js" defer></script>
<script src="/static/app.js?v={{.AssetVer}}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{.CSRF}}"}'>
<header class="top">
  <a class="brand" href="/">MyHome</a>
  <nav class="nav">
    <a href="/" {{if eq .Active "dashboard"}}aria-current="page"{{end}}>대시보드</a>
    <a href="/transactions" {{if eq .Active "transactions"}}aria-current="page"{{end}}>거래</a>
    <a href="/review" {{if eq .Active "review"}}aria-current="page"{{end}}>확인 필요{{if gt .ReviewCount 0}} <span class="badge">{{.ReviewCount}}</span>{{end}}</a>
    <a href="/budgets" {{if eq .Active "budgets"}}aria-current="page"{{end}}>예산</a>
    <a href="/analytics" {{if eq .Active "analytics"}}aria-current="page"{{end}}>분석</a>
    <a href="/report" {{if eq .Active "report"}}aria-current="page"{{end}}>리포트</a>
    <a href="/reconcile" {{if eq .Active "reconcile"}}aria-current="page"{{end}}>대사</a>
    <a href="/admin" {{if eq .Active "admin"}}aria-current="page"{{end}}>관리</a>
  </nav>
  <div class="top-actions">
    <button type="button" class="icon-btn" id="theme-toggle" title="밝게/어둡게" aria-label="밝게/어둡게 전환"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
    <form method="post" action="/auth/logout"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><button class="link-btn">로그아웃</button></form>
  </div>
</header>
<main class="container">
  {{if .Flash}}<div class="flash ok" role="status">{{.Flash}}</div>{{end}}
  {{if .Error}}<div class="flash err" role="alert">{{.Error}}</div>{{end}}
  {{if .Month}}
  <div class="period-nav">
    <a class="btn ghost" href="?month={{.PrevMonth}}">‹ {{.PrevMonth}}</a>
    <strong>{{.Month}}</strong>
    <a class="btn ghost" href="?month={{.NextMonth}}">{{.NextMonth}} ›</a>
  </div>
  {{end}}
  {{template "content" .}}
</main>
<div id="toast" class="toast" hidden></div>
</body>
</html>{{end}}
